<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>crts.io</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/game-style.css">

  <script src="https://unpkg.com/lodash@4.17.20"></script>
</head>

<body>
  <div id="canvas-support">Sorry, your browser does not support HTML canvas.</div>

  <!-- Name input -->
  <div id="name-input">
    <label for="name">Enter name:</label>
    <input type="text" name="name" id="name" required size="20">
    <button id="name-input-button">Play!</button>
  </div>

  <div id="lap-popup">Lap time: <span id="lap-time"></span></div>
  <div id="best-lap">Best lap: <span id="best-lap-time"></span></div>
  <div id="game">
    <canvas id="main-canvas"></canvas>

    <!-- Lap popup -->


    <!-- Vehicle Upgrades -->
    <div id="vehicle-upgrades" class="upgrades">

      <h3>Vehicle Upgrades</h3>

      <div id="Bike-upgrades" class="upgrade-row">
        <div id="Car-button" class="upgrade-button">
          <img src="./icons/Car.svg" alt="Car">
          <p>Car</p>
        </div>
        <div id="Moped-button" class="upgrade-button">
          <img src="./icons/Moped.svg" alt="Moped">
          <p>Moped</p>
        </div>
        <div id="Hoverboard-button" class="upgrade-button">
          <img src="./icons/Hoverboard.svg" alt="Hoverboard">
          <p>Hoverboard</p>
        </div>
      </div>

      <div id="Car-upgrades" class="upgrade-row">
        <div id="Truck-button" class="upgrade-button">
          <img src="./icons/Truck.svg" alt="Truck">
          <p>Truck</p>
        </div>
        <div id="Racecar-button" class="upgrade-button">
          <img src="./icons/Racecar.svg" alt="Racecar">
          <p>Racecar</p>
        </div>
      </div>

      <div id="Moped-upgrades" class="upgrade-row">
        <div id="Motorcycle-button" class="upgrade-button">
          <img src="./icons/Motorcycle.svg" alt="Motorcycle">
          <p>Motorcycle</p>
        </div>
      </div>

      <div id="Hoverboard-upgrades" class="upgrade-row">
        <div id="Cybertruck-button" class="upgrade-button">
          <img src="./icons/Cybertruck.svg" alt="Cybertruck">
          <p>Cybertruck</p>
        </div>
        <div id="UFO-button" class="upgrade-button">
          <img src="./icons/UFO.svg" alt="UFO">
          <p>UFO</p>
        </div>
      </div>
    </div>

    <!-- Character Upgrades -->
    <div id="character-upgrades" class="upgrades">

      <h3>Character Upgrades</h3>

      <div id="Rifleman-upgrades" class="upgrade-row">
        <div id="Gunner-button" class="upgrade-button">
          <img src="./icons/Gunner.svg" alt="Gunner">
          <p>Gunner</p>
        </div>
        <div id="Sniper-button" class="upgrade-button">
          <img src="./icons/Sniper.svg" alt="Sniper">
          <p>Sniper</p>
        </div>
        <div id="Cannoneer-button" class="upgrade-button">
          <img src="./icons/Cannoneer.svg" alt="Cannoneer">
          <p>Cannoneer</p>
        </div>
      </div>

      <div id="Gunner-upgrades" class="upgrade-row">
        <div id="Gatling-button" class="upgrade-button">
          <img src="./icons/Gatling.svg" alt="Gatling">
          <p>Gatling</p>
        </div>
        <div id="Sprayer-button" class="upgrade-button">
          <img src="./icons/Sprayer.svg" alt="Sprayer">
          <p>Sprayer</p>
        </div>
      </div>

      <div id="Sniper-upgrades" class="upgrade-row">
        <div id="Hitman-button" class="upgrade-button">
          <img src="./icons/Hitman.svg" alt="Hitman">
          <p>Hitman</p>
        </div>
      </div>

      <div id="Cannoneer-upgrades" class="upgrade-row">
        <div id="TripleShot-button" class="upgrade-button">
          <img src="./icons/TripleShot.svg" alt="Triple Shot">
          <p>Triple Shot</p>
        </div>
        <div id="Bomber-button" class="upgrade-button">
          <img src="./icons/Bomber.svg" alt="Bomber">
          <p>Bomber</p>
        </div>
      </div>
    </div>

    <!-- Lower HUD -->
    <div id="bottom-display">
      <div id="speedometer-container">
        <div id="speedometer-border">
          <div id="speedometer-fill">
          </div>
        </div>
      </div>

      <div id="ign">Placeholder Name</div>
      <div id="level-container">
        <div id="level-progress-bar"></div>
        <p id="level-progress-text">700/1000</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./dist/bundle.js"></script>
  <!-- <script type="module" src="./dist/src/player/player.ts"></script> -->
  <!-- <script type="module" src="./dist/src/main.js"></script> -->
</body>

</html>
